name: citylife
description: City Life - Your Urban Companion App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ── State Management ──────────────────────────────
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # ── Navigation ────────────────────────────────────
  go_router: ^13.2.0

  # ── Database ──────────────────────────────────────
  sqflite: ^2.3.3             # Local SQLite database
  path: ^1.9.0                # Path utilities for DB

  # ── Firebase (Auth + Firestore for real-time) ────
  firebase_core: ^3.15.2
  firebase_auth: ^5.1.4
  cloud_firestore: ^5.4.0
  firebase_storage: ^12.3.0  
  google_sign_in: ^6.2.1
  firebase_database: ^11.3.10

  # ── Maps ─────────────────────────────────────────
  google_maps_flutter: ^2.7.0
  geolocator: ^12.0.0
  geocoding: ^3.0.0

  # ── UI & Design ───────────────────────────────────
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0             # Skeleton loaders
  lottie: ^3.1.2              # Animations
  flutter_animate: ^4.5.0     # Micro-animations

  # ── Utilities ────────────────────────────────────
  shared_preferences: ^2.3.2  # Local key-value storage
  connectivity_plus: ^6.0.3   # Network status
  package_info_plus: ^8.0.2   # App version info
  intl: ^0.19.0               # Date/number formatting
  url_launcher: ^6.3.0        # Open URLs/maps
  image_picker: ^1.1.2        # Camera & gallery
  permission_handler: ^11.3.1 # Runtime permissions
  local_auth: ^2.3.0          # Biometric login
  http: ^1.2.2                # REST API calls
  dio: ^5.5.0+1               # Advanced HTTP client

  # ── Icons ─────────────────────────────────────────
  cupertino_icons: ^1.0.8
  flutter_iconly: ^1.0.2      # Beautiful icon pack

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/

  fonts:
    - family: Sora
      fonts:
        - asset: assets/fonts/Sora-Regular.ttf
        - asset: assets/fonts/Sora-Medium.ttf
          weight: 500
        - asset: assets/fonts/Sora-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Sora-Bold.ttf
          weight: 700
    - family: DM Sans
      fonts:
        - asset: assets/fonts/DMSans-Regular.ttf
        - asset: assets/fonts/DMSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/DMSans-Bold.ttf
          weight: 700